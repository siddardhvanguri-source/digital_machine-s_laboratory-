    /* Custom Scrollbars */

      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--indigo-primary);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--gold-accent);
    }

    .glass-card {
      background: var(--glass-bg);

      backdrop-filter: blur(16px);
      border-radius: 16px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);

      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--glass-border);

    /* Stamped Industrial Nameplate styling */
    .stamped-nameplate {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 2px solid #64748b;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.8), 0 4px 12px rgba(0,0,0,0.5);
      position: relative;
    }
    .stamped-nameplate::before, .stamped-nameplate::after {
      content: '';
      position: absolute;
      width: 6px;
      height: 6px;
      background: #475569;
      border-radius: 50%;
      box-shadow: 1px 1px 2px rgba(0,0,0,0.6);

    .stamped-nameplate::after { top: 6px; right: 6px; }

      left: 24px;
      z-index: 1000;
      pointer-events: auto;

      }
    }

    // Component: Math Equation Renderer
    function MathEquation({ tex, inline = false }) {
      const containerRef = useRef(null);
      useEffect(() => {
        if (containerRef.current) {
          if (typeof window.katex !== "undefined") {
            window.katex.render(tex, containerRef.current, {
              displayMode: !inline,
              throwOnError: false
            });
          } else {
            containerRef.current.textContent = tex;
          }
        }
      }, [tex, inline]);
      return <span ref={containerRef} className="font-mono text-sky-400" />;
    }

    // Custom ML Predictor Evaluators
    function evalMLP(network, scaledX) {
      const W1 = network.W1;
      const b1 = network.b1;
      const W2 = network.W2;
      const b2 = network.b2;
      
      const H = b1.length;
      const hidden = [];
      for (let h = 0; h < H; h++) {
        let z = b1[h];
        for (let i = 0; i < 3; i++) {
          z += scaledX[i] * W1[i][h];
        }
        hidden.push(Math.max(0, z)); // ReLU
      }
      
      let out = b2[0];
      for (let h = 0; h < H; h++) {
        out += hidden[h] * W2[h][0];
      }
      return out;
    }

    function evalTree(node, x) {
      if (node.type === "leaf") {
        return node.value;
      }
      const val = x[node.feature_idx];
      if (val <= node.threshold) {
        return evalTree(node.left, x);
      } else {
        return evalTree(node.right, x);
      }
    }

    function evalForest(forest, x) {
      const preds = forest.map(tree => evalTree(tree, x));
      return preds.reduce((a, b) => a + b, 0) / preds.length;
    }

    function evalPoly(coefs, x) {
      const [x0, x1, x2] = x;
      const polyFeatures = [
        1, 
        x0, x1, x2, 
        x0*x0, x0*x1, x0*x2, 
        x1*x1, x1*x2, 
        x2*x2
      ];
      return coefs.reduce((sum, coef, idx) => sum + coef * polyFeatures[idx], 0);
    }

      // Interactive measurements

      const [circuitViewMode, setCircuitViewMode] = useState("per-phase");

      // Synchronize slider state when dataset/activeFacility changes

      // Calculate physics metrics for the Induction Motor
      const motorPhysicsResults = useMemo(() => {
        const V_ph = voltage / Math.sqrt(3);
        const Ns = (120 * frequency) / 4; 
        const speed = (1 - slip) * Ns;
        const omega_s = (2 * Math.PI * Ns) / 60;
        const omega_m = (2 * Math.PI * speed) / 60;

        const zm_denom = rc * rc + xm * xm;
        const zm_re = (rc * xm * xm) / zm_denom;
        const zm_im = (rc * rc * xm) / zm_denom;

        let Z2_re = 0;
        let Z2_im = x2Prime;
        if (slip > 0) Z2_re = r2Prime / slip;

        const num_re = zm_re * Z2_re - zm_im * Z2_im;
        const num_im = zm_re * Z2_im + zm_im * Z2_re;
        const den_re = zm_re + Z2_re;
        const den_im = zm_im + Z2_im;
        const den_mag2 = den_re * den_re + den_im * den_im;
        
        const zp_re = den_mag2 > 0 ? (num_re * den_re + num_im * den_im) / den_mag2 : 0;
        const zp_im = den_mag2 > 0 ? (num_im * den_re - num_re * den_im) / den_mag2 : 0;

        const zin_re = r1 + zp_re;
        const zin_im = x1 + zp_im;
        const zin_mag2 = zin_re * zin_re + zin_im * zin_im;
        const zin_mag = Math.sqrt(zin_mag2);

        const i1_mag = zin_mag > 0 ? V_ph / zin_mag : 0;
        const pf = zin_mag > 0 ? zin_re / zin_mag : 1.0;
        const theta = Math.acos(pf);

        const p_in = Math.sqrt(3) * voltage * i1_mag * pf; 

        const i1_re = i1_mag * pf;
        const i1_im = -i1_mag * Math.sin(theta);
        const e1_re = V_ph - (i1_re * r1 - i1_im * x1);
        const e1_im = -(i1_re * x1 + i1_im * r1);
        const e1_mag = Math.sqrt(e1_re * e1_re + e1_im * e1_im);

        const z2_mag2 = Z2_re * Z2_re + Z2_im * Z2_im;
        const i2_prime_mag = z2_mag2 > 0 ? e1_mag / Math.sqrt(z2_mag2) : 0;

        const stator_cu_loss = 3 * i1_mag * i1_mag * r1;
        const iron_loss = rc > 0 ? (3 * e1_mag * e1_mag) / rc : 0;
        const rotor_cu_loss = 3 * i2_prime_mag * i2_prime_mag * r2Prime;
        
        const p_ag = slip > 0 ? 3 * i2_prime_mag * i2_prime_mag * (r2Prime / slip) : 0;
        const p_conv = (1 - slip) * p_ag;
        
        let p_out = p_conv - pRot;
        if (p_out < 0) p_out = 0;

        const t_dev = p_ag / omega_s;
        const t_shaft = speed > 0 ? (p_out / omega_m) : 0;
        const eff = p_in > 0 ? (p_out / p_in) * 100 : 0;

        // Visual spring scale values
        const s_drum = activeData[selectedDataset].experimental.R_drum || 0.126;
        const s_diff = t_shaft / (9.81 * s_drum); // (S2 - S1) in kg
        const S1 = Math.max(0.0, loadTorque * 0.15);
        const S2 = S1 + s_diff;

        const winding_temp = 35 + (stator_cu_loss + iron_loss) * 0.05 + loadTorque * 2.8;

        return {
          V_ph, Ns, speed, i1_mag, pf, p_in, e1_mag, i2_prime_mag,
          stator_cu_loss, iron_loss, rotor_cu_loss, p_ag, p_conv, p_out,
          t_dev, t_shaft, eff, S1, S2, winding_temp
        };
      }, [voltage, slip, frequency, r1, r2Prime, x1, x2Prime, xm, rc, pRot, loadTorque, selectedDataset]);

      // Calculate physics metrics for the Alternator
      const alternatorPhysicsResults = useMemo(() => {
        const Eph = 240 * (aSpeed / 1500.0) * (aIf / 1.05);
        const phi_rad = Math.acos(Math.abs(aPF)) * (aPF < 0 ? -1 : 1); 
        
        const B = 2 * aIa * (aRa * Math.cos(phi_rad) + aXs * Math.sin(phi_rad));
        const C = (aIa**2) * (aRa**2 + aXs**2) - Eph**2;
        const disc = B**2 - 4*C;
        
        const vt_ph = disc >= 0 ? Math.max(20.0, (-B + Math.sqrt(disc)) / 2) : 20.0;
        const vt_line = vt_ph * Math.sqrt(3);
        const vr = ((Eph - vt_ph) / vt_ph) * 100.0;
        
        const p_out = 3.0 * vt_ph * aIa * Math.cos(phi_rad);
        const q_out = 3.0 * vt_ph * aIa * Math.sin(phi_rad);
        const losses = 3 * aIa * aIa * aRa + 250.0;
        const eff = p_out > 0 ? (p_out / (p_out + losses)) * 100.0 : 0.0;
        
        return {
          Eph, vt_ph, vt_line, vr, p_out, q_out, losses, eff

            const rfVal = evalForest(modelsObj.models.rf.forests[i], rawInput);
            const mlpVal = evalMLP(modelsObj.models.mlp.networks[i], scaledX);
            
            predictions[name] = {
              poly: polyVal, rf: rfVal, mlp: mlpVal,

                poly: modelsObj.models.poly.r2[i],
                rf: modelsObj.models.rf.r2[i],
                mlp: modelsObj.models.mlp.r2[i]
              }
            };
          });
          return predictions;
        }

                          <p className="text-slate-400 text-xs">
                            An induction motor operates on the principle of Faraday's Law of Electromagnetic Induction. When a 3-phase stator winding is excited by a balanced 3-phase AC supply, it establishes a Rotating Magnetic Field (RMF) that spins at synchronous speed (Ns). As this RMF sweeps past the rotor conductors, it induces an electromotive force (EMF) in them due to relative motion, generating rotor current. The interaction of these induced rotor currents with the stator RMF creates torque, dragging the rotor in the direction of the rotating field.

                          </p>

                          </p>

                          </div>

                          </p>

                          </p>

    // Component: Live Oscilloscope
    function Oscilloscope({ frequency, voltage }) {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animId;
        let phase = 0;

        const draw = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          
          ctx.strokeStyle = "rgba(255,255,255,0.06)";
          ctx.lineWidth = 1;
          for(let i=0; i<canvas.width; i+=20) {
            ctx.beginPath();
            ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height);
            ctx.stroke();
          }
          for(let j=0; j<canvas.height; j+=20) {
            ctx.beginPath();
            ctx.moveTo(0, j); ctx.lineTo(canvas.width, j);
            ctx.stroke();
          }

          const amp = Math.min(30, (voltage / 480) * 30);
          const speed = (frequency / 50) * 0.15;

          const colors = ["#f43f5e", "#fbbf24", "#3b82f6"]; // R, Y, B phases
          for (let p = 0; p < 3; p++) {
            ctx.strokeStyle = colors[p];
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            for (let x = 0; x < canvas.width; x++) {
              const y = canvas.height/2 + amp * Math.sin((x * 0.08) - phase + (p * Math.PI * 2 / 3));
              if (x === 0) ctx.moveTo(x, y);
              else ctx.lineTo(x, y);
            }
            ctx.stroke();
          }

          phase += speed;
          animId = requestAnimationFrame(draw);
        };
        draw();

        return () => cancelAnimationFrame(animId);
      }, [frequency, voltage]);

      return <canvas ref={canvasRef} width="220" height="90" className="w-full h-auto bg-slate-950 rounded border border-slate-900"></canvas>;
    }

      useEffect(() => {
        setCurveType(facility === "motor" ? "torque-speed" : "capability-pq");
      }, [facility]);

      useEffect(() => {
        if (!containerRef.current || typeof window.Plotly === "undefined") return;

        if (facility === "motor") {
          const slipArr = [];
          const speedArr = [];
          const torqueArr = [];
          const pOutArr = [];
          const effArr = [];
          const pfArr = [];
          const currentArr = [];

          for (let s = 0.0001; s <= 0.1; s += 0.001) {
            const Ns = (120 * frequency) / 4;
            const speed = (1 - s) * Ns;
            const V_ph = voltage / Math.sqrt(3);

            const zm_denom = rc * rc + xm * xm;
            const zm_re = (rc * xm * xm) / zm_denom;
            const zm_im = (rc * rc * xm) / zm_denom;
            const z2_re = r2Prime / s;
            const z2_im = x2Prime;

            const num_re = zm_re * z2_re - zm_im * z2_im;
            const num_im = zm_re * z2_im + zm_im * z2_re;
            const den_re = zm_re + z2_re;
            const den_im = zm_im + z2_im;
            const den_mag2 = den_re * den_re + den_im * den_im;

            const zp_re = den_mag2 > 0 ? (num_re * den_re + num_im * den_im) / den_mag2 : 0;
            const zp_im = den_mag2 > 0 ? (num_im * den_re - num_re * den_im) / den_mag2 : 0;

            const zin_re = r1 + zp_re;
            const zin_im = x1 + zp_im;
            const zin_mag2 = zin_re * zin_re + zin_im * zin_im;
            const zin_mag = Math.sqrt(zin_mag2);

            const i1_mag = zin_mag > 0 ? V_ph / zin_mag : 0;
            const pf = zin_mag > 0 ? zin_re / zin_mag : 1.0;
            const p_in = 3 * V_ph * i1_mag * pf;

            const i1_re = i1_mag * pf;
            const i1_im = -i1_mag * Math.sin(Math.acos(pf));
            const e1_re = V_ph - (i1_re * r1 - i1_im * x1);
            const e1_im = -(i1_re * x1 + i1_im * r1);
            const e1_mag = Math.sqrt(e1_re * e1_re + e1_im * e1_im);

            const z2_mag2 = z2_re * z2_re + z2_im * z2_im;
            const i2_prime_mag = z2_mag2 > 0 ? e1_mag / Math.sqrt(z2_mag2) : 0;

            const p_ag = 3 * i2_prime_mag * i2_prime_mag * z2_re;
            const p_conv = (1 - s) * p_ag;
            const p_out = Math.max(0, p_conv - pRot);
            const t_shaft = speed > 0 ? (p_out / ((2 * Math.PI * speed) / 60)) : 0;
            const eff = p_in > 0 ? (p_out / p_in) * 100 : 0;

            slipArr.push(s * 100);
            speedArr.push(speed);
            torqueArr.push(t_shaft);
            pOutArr.push(p_out);
            effArr.push(eff);
            pfArr.push(pf);
            currentArr.push(i1_mag);
          }

          let traceX = [], traceY = [], xLabel = "", yLabel = "", title = "", traceColor = "#fbbf24";
          let cursorVal = 0;

          if (curveType === "torque-speed") {
            traceX = speedArr;
            traceY = torqueArr;
            xLabel = "Rotor Speed (RPM)";
            yLabel = "Shaft Torque (Nm)";
            title = "Torque vs Speed Curve";
            traceColor = "#fbbf24";
            cursorVal = (1 - currentSlip) * ((120 * frequency)/4);
          } else if (curveType === "torque-slip") {
            traceX = slipArr;
            traceY = torqueArr;
            xLabel = "Slip (%)";
            yLabel = "Shaft Torque (Nm)";
            title = "Torque vs Slip Characteristic";
            traceColor = "#ef4444";
            cursorVal = currentSlip * 100;
          } else if (curveType === "eff-power") {
            traceX = pOutArr;
            traceY = effArr;
            xLabel = "Output Shaft Power (W)";
            yLabel = "Efficiency (%)";
            title = "Efficiency vs Output Power";
            traceColor = "#10b981";
            cursorVal = currentPower;
          } else if (curveType === "current-load") {
            traceX = pOutArr;
            traceY = currentArr;
            xLabel = "Output Power (W)";
            yLabel = "Line Current (A)";
            title = "Stator Line Current vs Load";
            traceColor = "#3b82f6";
            cursorVal = currentPower;
          }

          const mainTrace = {
            x: traceX,
            y: traceY,
            type: "scatter",
            mode: "lines",
            line: { color: traceColor, width: 3 },
            name: title
          };

          const cursorLine = {
            x: [cursorVal, cursorVal],
            y: [0, Math.max(...traceY, 1.0)],
            type: "scatter",
            mode: "lines",
            line: { color: "#ffffff", dash: "dash", width: 1.5 },
            name: "Operating point"
          };

          const layout = {
            paper_bgcolor: "rgba(0,0,0,0)",
            plot_bgcolor: "rgba(10, 15, 30, 0.4)",
            xaxis: { title: xLabel, color: "#94a3b8", gridcolor: "rgba(255,255,255,0.05)" },
            yaxis: { title: yLabel, color: "#94a3b8", gridcolor: "rgba(255,255,255,0.05)" },
            margin: { l: 60, r: 20, t: 20, b: 40 },
            legend: { font: { color: "#94a3b8" } }
          };

          Plotly.newPlot(containerRef.current, [mainTrace, cursorLine], layout, { responsive: true });
        } else {
          // Alternator capability curves / circle diagrams P-Q plots
          if (curveType === "capability-pq") {
            const P_points = [];
            const Q_stator_points = [];
            const Q_rotor_points = [];
            const Q_stator_lower_points = [];

            // Ratings
            const Vt_ph = alternatorResults.vt_ph;
            const S_rated = 3.0 * Vt_ph * 5.0; 
            const Eph_max = 240.0 * (1.3 / 1.05); 
            const Q_offset = (3.0 * Vt_ph * Vt_ph) / aXs;
            const R_rotor = (3.0 * Vt_ph * alternatorResults.Eph) / aXs;
            const R_rotor_max = (3.0 * Vt_ph * Eph_max) / aXs;

            const angleStep = Math.PI / 100;
            for (let a = 0; a <= Math.PI; a += angleStep) {
              const p_s = S_rated * Math.sin(a);
              const q_s = S_rated * Math.cos(a);
              P_points.push(p_s);
              Q_stator_points.push(q_s);
              Q_stator_lower_points.push(-q_s);

              const p_r = R_rotor_max * Math.sin(a);
              const q_r = -Q_offset + R_rotor_max * Math.cos(a);
              Q_rotor_points.push(q_r);
            }

            const statorTrace = {
              x: P_points,
              y: Q_stator_points,
              type: "scatter",
              mode: "lines",
              line: { color: "#3b82f6", width: 2, dash: "dot" },
              name: "Stator Heating Limit"
            };

            const statorLowerTrace = {
              x: P_points,
              y: Q_stator_lower_points,
              type: "scatter",
              mode: "lines",
              line: { color: "#3b82f6", width: 2, dash: "dot" },
              showlegend: false
            };

            const rotorTrace = {
              x: P_points,
              y: Q_rotor_points,
              type: "scatter",
              mode: "lines",
              line: { color: "#ef4444", width: 2 },
              name: "Rotor Excitation Limit"
            };

            // Active operating point
            const activeP = alternatorResults.p_out;
            const activeQ = alternatorResults.q_out;

            const activePtTrace = {
              x: [activeP],
              y: [activeQ],
              type: "scatter",
              mode: "markers+text",
              marker: { color: "#fbbf24", size: 10, symbol: "circle-dot" },
              text: ["Operating Point"],
              textposition: "top right",
              name: "Operating point P-Q"
            };

            const layout = {
              paper_bgcolor: "rgba(0,0,0,0)",
              plot_bgcolor: "rgba(10, 15, 30, 0.4)",
              xaxis: { title: "Active Power P (W)", color: "#94a3b8", gridcolor: "rgba(255,255,255,0.05)" },
              yaxis: { title: "Reactive Power Q (VAR)", color: "#94a3b8", gridcolor: "rgba(255,255,255,0.05)" },
              margin: { l: 60, r: 20, t: 20, b: 40 },
              legend: { font: { color: "#94a3b8" } }
            };

            Plotly.newPlot(containerRef.current, [statorTrace, statorLowerTrace, rotorTrace, activePtTrace], layout, { responsive: true });
          } else {
            // Vt vs Ia curves
            const iaVals = Array.from({length: 30}, (_, i) => i * 0.25);
            const Eph = 240 * (aIf / 1.05);

            const getVt = (ia, pf_val) => {
              const phi = Math.acos(Math.abs(pf_val)) * (pf_val < 0 ? -1 : 1);
              const B = 2 * ia * (aRa * Math.cos(phi) + aXs * Math.sin(phi));
              const C = ia**2 * (aRa**2 + aXs**2) - Eph**2;
              const disc = B**2 - 4*C;
              const Vt_ph = disc >= 0 ? Math.max(20.0, (-B + Math.sqrt(disc)) / 2) : 20.0;
              return Vt_ph * Math.sqrt(3);
            };

            const vtLag = iaVals.map(ia => getVt(ia, 0.8));
            const vtUnity = iaVals.map(ia => getVt(ia, 1.0));
            const vtLead = iaVals.map(ia => getVt(ia, -0.8));
            const activeIaVal = aIa;
            const activeVtVal = alternatorResults.vt_line;

            Plotly.newPlot(containerRef.current, [
              { x: iaVals, y: vtLag, type: 'scatter', mode: 'lines', name: '0.8 Lagging PF', line: { color: '#ef4444' } },
              { x: iaVals, y: vtUnity, type: 'scatter', mode: 'lines', name: '1.0 Unity PF', line: { color: '#10b981' } },
              { x: iaVals, y: vtLead, type: 'scatter', mode: 'lines', name: '0.8 Leading PF', line: { color: '#00E5FF' } },
              { x: [activeIaVal], y: [activeVtVal], type: 'scatter', mode: 'markers', marker: { color: '#ffffff', size: 8 }, name: 'Active point' }
            ], {
              paper_bgcolor: 'rgba(0,0,0,0)',
              plot_bgcolor: 'rgba(10, 15, 30, 0.4)',
              font: { color: '#F4F3EF', size: 10 },
              xaxis: { title: 'Armature Current Ia (A)', gridcolor: 'rgba(255,255,255,0.05)', color: "#94a3b8" },
              yaxis: { title: 'Terminal Line Voltage Vt (V)', gridcolor: 'rgba(255,255,255,0.05)', color: "#94a3b8" },
              margin: { l: 60, r: 20, t: 20, b: 40 },
              legend: { font: { color: '#94a3b8' } }
            });
          }
        }

      }, [curveType, r1, r2Prime, x1, x2Prime, xm, rc, pRot, voltage, frequency, currentSlip, currentPower, aIf, aIa, aPF, aSpeed, aRa, aXs, alternatorResults, facility]);

      return (
        <div className="space-y-3">
          <div className="flex space-x-1.5 overflow-x-auto text-[10px]">
            {facility === "motor" ? (
              <>
                <button onClick={() => setCurveType("torque-speed")} className={`px-3 py-1 rounded border font-bold uppercase transition-all ${curveType === 'torque-speed' ? 'bg-indigo-950 border-indigo-500 text-yellow-500' : 'bg-slate-900 border-slate-800 text-slate-400'}`}>Torque vs Speed</button>
                <button onClick={() => setCurveType("torque-slip")} className={`px-3 py-1 rounded border font-bold uppercase transition-all ${curveType === 'torque-slip' ? 'bg-indigo-950 border-indigo-500 text-yellow-500' : 'bg-slate-900 border-slate-800 text-slate-400'}`}>Torque vs Slip</button>
                <button onClick={() => setCurveType("eff-power")} className={`px-3 py-1 rounded border font-bold uppercase transition-all ${curveType === 'eff-power' ? 'bg-indigo-950 border-indigo-500 text-yellow-500' : 'bg-slate-900 border-slate-800 text-slate-400'}`}>Eff vs Output</button>
                <button onClick={() => setCurveType("current-load")} className={`px-3 py-1 rounded border font-bold uppercase transition-all ${curveType === 'current-load' ? 'bg-indigo-950 border-indigo-500 text-yellow-500' : 'bg-slate-900 border-slate-800 text-slate-400'}`}>Current vs Load</button>
              </>
            ) : (
              <>
                <button onClick={() => setCurveType("capability-pq")} className={`px-3 py-1 rounded border font-bold uppercase transition-all ${curveType === 'capability-pq' ? 'bg-indigo-950 border-indigo-500 text-yellow-500' : 'bg-slate-900 border-slate-800 text-slate-400'}`}>Capability Curve (P-Q)</button>
                <button onClick={() => setCurveType("load-vt-ia")} className={`px-3 py-1 rounded border font-bold uppercase transition-all ${curveType === 'load-vt-ia' ? 'bg-indigo-950 border-indigo-500 text-yellow-500' : 'bg-slate-900 border-slate-800 text-slate-400'}`}>Vt vs Ia Load Curve</button>
              </>
            )}
          </div>
          <div ref={containerRef} className="w-full min-h-[250px]"></div>
        </div>
      );
    }

    // Component: Alternator Interactive Phasor Diagram
    function PhasorDiagram({ aIa, aPF, aRa, aXs, vt_ph, Eph }) {
      const canvasRef = useRef(null);

      useEffect(() => {
        const svg = canvasRef.current;
        if (!svg) return;

        const theta = Math.acos(Math.abs(aPF)) * (aPF < 0 ? 1 : -1); 

        const vScale = 0.8;
        const iScale = 15;
        const impedanceScale = 4.0;

        const vt_x = vt_ph * vScale;
        const vt_y = 0;

        const ia_x = 5.0 * iScale * Math.cos(theta);
        const ia_y = 5.0 * iScale * Math.sin(theta);

        const ira_x = aIa * aRa * impedanceScale * Math.cos(theta);
        const ira_y = aIa * aRa * impedanceScale * Math.sin(theta);

        const ixs_x = aIa * aXs * impedanceScale * 0.45 * Math.cos(theta + Math.PI / 2);
        const ixs_y = aIa * aXs * impedanceScale * 0.45 * Math.sin(theta + Math.PI / 2);

        const ef_x = vt_x + ira_x + ixs_x;
        const ef_y = vt_y + ira_y + ixs_y;

        svg.innerHTML = `
          <!-- grids -->
          <line x1="20" y1="210" x2="380" y2="210" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" />
          <line x1="50" y1="20" x2="50" y2="250" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" />
          <circle cx="50" cy="210" r="4" fill="#64748b" />
          
          <!-- Current vector Ia -->
          <line x1="50" y1="210" x2="${50 + ia_x}" y2="${210 - ia_y}" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3" />
          <polygon points="${50 + ia_x},${210 - ia_y} ${45 + ia_x},${215 - ia_y} ${47 + ia_x},${205 - ia_y}" fill="#94a3b8" />
          <text x="${60 + ia_x}" y="${210 - ia_y}" fill="#cbd5e1" font-size="9" font-weight="bold" font-family="Space Grotesk">Ia</text>

          <!-- Terminal Voltage Vt vector -->
          <line x1="50" y1="210" x2="${50 + vt_x}" y2="210" stroke="#3b82f6" stroke-width="3" />
          <polygon points="${50 + vt_x},210 ${42 + vt_x},206 ${42 + vt_x},214" fill="#3b82f6" />
          <text x="${60 + vt_x}" y="213" fill="#3b82f6" font-size="10" font-weight="bold" font-family="Space Grotesk">Vt</text>

          <!-- Ia*Ra resistive vector -->
          <line x1="${50 + vt_x}" y1="210" x2="${50 + vt_x + ira_x}" y2="${210 - ira_y}" stroke="#eab308" stroke-width="2.5" />
          <polygon points="${50 + vt_x + ira_x},${210 - ira_y} ${45 + vt_x + ira_x},${215 - ira_y} ${45 + vt_x + ira_x},${205 - ira_y}" fill="#eab308" />
          <text x="${50 + vt_x + ira_x + 5}" y="${210 - ira_y - 5}" fill="#eab308" font-size="8" font-family="Space Grotesk">Ia*Ra</text>

          <!-- jIa*Xs reactance vector -->
          <line x1="${50 + vt_x + ira_x}" y1="${210 - ira_y}" x2="${50 + ef_x}" y2="${210 - ef_y}" stroke="#ef4444" stroke-width="2.5" />
          <text x="${50 + ef_x + 5}" y="${210 - ef_y + 10}" fill="#ef4444" font-size="8" font-family="Space Grotesk">jIa*Xs</text>

          <!-- Generated EMF Ef vector -->
          <line x1="50" y1="210" x2="${50 + ef_x}" y2="${210 - ef_y}" stroke="#10b981" stroke-width="3" />
          <polygon points="${50 + ef_x},${210 - ef_y} ${43 + ef_x},${215 - ef_y} ${47 + ef_x},${203 - ef_y}" fill="#10b981" />
          <text x="${60 + ef_x}" y="${210 - ef_y - 5}" fill="#10b981" font-size="10" font-weight="bold" font-family="Space Grotesk">Eph</text>
        `;
      }, [aIa, aPF, aRa, aXs, vt_ph, Eph]);

      return (
        <svg ref={canvasRef} width="100%" height="260" viewBox="0 0 400 260" className="max-w-[400px]"></svg>
      );
    }

        altSpeedRef.current = altSpeed;

        });

          scalePointer1 = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.04, 0.06), new THREE.MeshBasicMaterial({ color: 0xef4444 }));
          scalePointer1.position.set(-0.7, 0.6, 0.02);

          // Spring Balance Right Framework

          frameR.userData = { name: "Spring Balance 2 (Tension S2)" };
          loadGroup.add(frameR);

          scalePointer2 = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.04, 0.06), new THREE.MeshBasicMaterial({ color: 0xef4444 }));
          scalePointer2.position.set(0.7, 0.6, 0.02);

          // Clickable tensioning load adjustment handwheel

          adjustWheel.position.set(0, 1.1, 0.3);
          adjustWheel.rotation.x = Math.PI / 2;
          adjustWheel.userData = { name: "Click to Rotate Tension Adjuster Knob" };
          loadGroup.add(adjustWheel);

          // Transparent click spheres for +/- in 3D
          const plusBtn = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 16), new THREE.MeshBasicMaterial({ color: 0x10b981, transparent: true, opacity: 0.6 }));
          plusBtn.position.set(0.35, 1.25, 0.3);
          plusBtn.userData = { name: "Click to increase load torque (+)" };
          loadGroup.add(plusBtn);

          const minusBtn = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 16), new THREE.MeshBasicMaterial({ color: 0xef4444, transparent: true, opacity: 0.6 }));
          minusBtn.position.set(-0.35, 1.25, 0.3);
          minusBtn.userData = { name: "Click to decrease load torque (-)" };
          loadGroup.add(minusBtn);

        } else {

          const coupling = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.32, 0.5, 32), new THREE.MeshStandardMaterial({ color: 0x475569, metalness: 0.9 }));
          coupling.rotation.x = Math.PI / 2;
          coupling.userData = { name: "Prime Mover coupling flange" };
          loadGroup.add(coupling);
        }

        // Live holographic display canvas
        const holoCanvas = document.createElement("canvas");

        holoCanvas.height = 64;

        const holoTex = new THREE.CanvasTexture(holoCanvas);
        const holoSpriteMat = new THREE.SpriteMaterial({ map: holoTex, transparent: true });
        const holoSprite = new THREE.Sprite(holoSpriteMat);
        holoSprite.scale.set(1.6, 0.4, 1.0);
        holoSprite.position.set(0, 1.8, 1.8);
        machineGroup.add(holoSprite);

        // Tachometer
        const speedSensor = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.15, 0.15), new THREE.MeshBasicMaterial({ color: 0x10b981 }));
        speedSensor.position.set(0, 1.35, 1.15);
        speedSensor.userData = { name: "Tachometer Rotation Speed Sensor" };
        machineGroup.add(speedSensor);

        // Stator RMF flux loop rings
        const rmfGroup = new THREE.Group();
        scene.add(rmfGroup);
        for (let i = 0; i < 4; i++) {
          const fluxRing = new THREE.Mesh(
            new THREE.TorusGeometry(0.88 + i * 0.05, 0.012, 8, 48),
            new THREE.MeshBasicMaterial({ color: facility === "motor" ? 0x6366f1 : 0xf59e0b, transparent: true, opacity: 0.4 })
          );
          fluxRing.position.set(0, 1.4, -0.4 + i * 0.4);
          rmfGroup.add(fluxRing);
        }

        // Raycasting
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        const onMouseMove = (e) => {
          const rect = renderer.domElement.getBoundingClientRect();
          mouse.x = ((e.clientX - rect.left) / width) * 2 - 1;
          mouse.y = -((e.clientY - rect.top) / height) * 2 + 1;
        };
        window.addEventListener("mousemove", onMouseMove);

        const onCanvasClick = (e) => {
          raycaster.setFromCamera(mouse, camera);
          const intersects = raycaster.intersectObjects(loadGroup.children, true);
          if (intersects.length > 0) {
            const hit = intersects[0].object;
            if (hit.userData.name && hit.userData.name.includes("+")) {
              setLoadTorque(prev => Math.min(30, prev + 1.0));
            } else if (hit.userData.name && hit.userData.name.includes("-")) {
              setLoadTorque(prev => Math.max(0, prev - 1.0));
            }
          }
        };
        renderer.domElement.addEventListener("click", onCanvasClick);

        let animationId;
        const clock = new THREE.Clock();

        const animate = () => {
          animationId = requestAnimationFrame(animate);
          const time = clock.getElapsedTime();
          const delta = clock.getDelta();
          const activeSpeed = facility === "motor" ? motorSpeedRef.current : altSpeedRef.current;
          const speedFactor = activeSpeed / 1500;

          // Rotation updates
          if (showRotationRef.current) {
            shaft.rotation.y += delta * 20 * speedFactor;
            rotorCoreGroup.rotation.y += delta * 20 * speedFactor;
            fanBlades.rotation.y += delta * 20 * speedFactor;
            
            if (facility === "motor") {
              const drumMesh = loadGroup.children[0];
              if (drumMesh) drumMesh.rotation.y += delta * 20 * speedFactor;
            } else {
              const couplingMesh = loadGroup.children[0];
              if (couplingMesh) couplingMesh.rotation.y += delta * 20 * speedFactor;
            }
          }

          // Rotating magnetic field animation
          rmfGroup.visible = showFluxRef.current;
          if (showFluxRef.current) {
            rmfGroup.rotation.z += delta * fluxIntensityRef.current * 15;
          }

          // Dynamic setting updates (cutaway / thermal mapping) without scene rebuilding
          const cutawayVal = showCutawayRef.current;
          const thermalVal = showThermalRef.current;
          
          casing.material.transparent = cutawayVal;
          casing.material.opacity = cutawayVal ? 0.2 : 1.0;
          casing.material.color.setHex(thermalVal ? 0xef4444 : (facility === "motor" ? 0x3b82f6 : 0xf59e0b));
          
          fanCowl.material.transparent = cutawayVal;
          fanCowl.material.opacity = cutawayVal ? 0.15 : 1.0;

          windingsGroup.children.forEach(coil => {
            coil.material.transparent = cutawayVal ? false : true;
            coil.material.opacity = cutawayVal ? 1.0 : 0.15;
          });

          // Move spring scale indicators dynamically
          if (facility === "motor" && scalePointer1 && scalePointer2) {
            scalePointer1.position.y = 0.6 - (motorS1Ref.current * 0.012);
            scalePointer2.position.y = 0.6 - (motorS2Ref.current * 0.012);
          }

          // Update dynamic 3D holographic digital readout canvas
          holoCtx.clearRect(0, 0, 256, 64);
          holoCtx.fillStyle = "rgba(10, 20, 42, 0.8)";
          holoCtx.fillRect(0, 0, 256, 64);
          holoCtx.strokeStyle = "#eab308";
          holoCtx.lineWidth = 2;
          holoCtx.strokeRect(2, 2, 252, 60);

          holoCtx.fillStyle = "#eab308";
          holoCtx.font = "bold 13px 'Space Grotesk', sans-serif";
          holoCtx.textAlign = "center";
          if (facility === "motor") {
            holoCtx.fillText(`LOAD TORQUE: ${loadTorqueRef.current.toFixed(1)} Nm`, 128, 25);
            holoCtx.fillText(`S1: ${motorS1Ref.current.toFixed(1)} kg | S2: ${motorS2Ref.current.toFixed(1)} kg`, 128, 48);
          } else {
            holoCtx.fillText(`ROT. SPEED: ${altSpeedRef.current.toFixed(0)} RPM`, 128, 25);
            holoCtx.fillText(`FIELD EXC. If: ${fluxIntensityRef.current.toFixed(2)} A`, 128, 48);
          }
          holoTex.needsUpdate = true;

          // Raycast hover labels
          raycaster.setFromCamera(mouse, camera);
          const intersects = raycaster.intersectObjects(machineGroup.children, true);
          if (intersects.length > 0) {
            const hit = intersects[0].object;
            const parent = hit.parent;
            const label = hit.userData.name || parent?.userData?.name || "Assembled Machine Core";
            setHoveredPart(label);
          } else {
            setHoveredPart("No Component Selected");
          }

          // Wiggle dust
          const posArr = pGeom.attributes.position.array;
          for (let i = 1; i < posArr.length; i += 3) {
            posArr[i] -= 0.004;
            if (posArr[i] < 0) posArr[i] = 5;
          }
          pGeom.attributes.position.needsUpdate = true;

          controls.update();
          renderer.render(scene, camera);
        };
        animate();

        const handleResize = () => {
          if (!mountRef.current) return;
          const w = mountRef.current.clientWidth;
          const h = mountRef.current.clientHeight || 480;
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
          renderer.setSize(w, h);
        };
        window.addEventListener("resize", handleResize);

        return () => {
          cancelAnimationFrame(animationId);
          window.removeEventListener("mousemove", onMouseMove);
          renderer.domElement.removeEventListener("click", onCanvasClick);
          window.removeEventListener("resize", handleResize);
          if (container) container.innerHTML = "";
        };
      }, [facility]); // Re-instantiate ONLY when facility changes! Super high performance.

      return (
        <div className="w-full h-full relative select-none">
          <div ref={mountRef} className="w-full h-full"></div>
        </div>
      );
    }

    function HeroSection({ setView, setActiveFacility, selectedDataset, setSelectedDataset, motorSpeed, altSpeed }) {

      const altSpeedRef = useRef(altSpeed);

        motorSpeedRef.current = motorSpeed;
        altSpeedRef.current = altSpeed;
      }, [selectedBay, motorSpeed, altSpeed]);

      useEffect(() => {
        if (!mountRef.current) return;
        const container = mountRef.current;

        const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);

        scene.add(dirLight);

        // Floor Grid
        const gridHelper = new THREE.GridHelper(120, 120, 0x4f46e5, 0x1e1b4b);
        gridHelper.position.y = -0.01;
        scene.add(gridHelper);

        const createHoloBase = (x, z, r, colorHex) => {
          const geom = new THREE.RingGeometry(r - 0.15, r, 64);

          mesh.rotation.x = Math.PI / 2;
          mesh.position.set(x, 0.02, z);
          scene.add(mesh);
          return mesh;
        };

        const motorBase = createHoloBase(-6, 0, 3.0, 0xf59e0b);
        const genBase = createHoloBase(6, 0, 3.0, 0x0ea5e9);

        // Helper to create a premium motor structure
        const createPremiumMachine = (group, frameColor, coilColor) => {
          // Stator Frame (Hollow Tube with 90-degree cutaway)
          const cutawayAngle = Math.PI * 1.5;
          const statorOuter = new THREE.CylinderGeometry(1.2, 1.2, 2.2, 32, 1, true, 0, cutawayAngle);
          const statorInner = new THREE.CylinderGeometry(0.8, 0.8, 2.2, 32, 1, true, 0, cutawayAngle);
          const statorMat = new THREE.MeshStandardMaterial({ color: frameColor, metalness: 0.9, roughness: 0.2, side: THREE.DoubleSide });
          
          const statorO = new THREE.Mesh(statorOuter, statorMat);
          const statorI = new THREE.Mesh(statorInner, statorMat);
          
          // Internal light
          const internalLight = new THREE.PointLight(coilColor, 2.0, 10);
          internalLight.position.y = 1.0;

          statorO.rotation.x = Math.PI / 2;
          statorI.rotation.x = Math.PI / 2;
          statorO.position.y = 1.0;
          statorI.position.y = 1.0;
          
          // Windings (Torus geometries inside stator)
          const windings = new THREE.Group();
          for(let i=0; i<3; i++) {
            const coil = new THREE.Mesh(
              new THREE.TorusGeometry(0.9, 0.1, 16, 32),
              new THREE.MeshStandardMaterial({ color: coilColor, metalness: 0.7, roughness: 0.5 })
            );

            windings.add(coil);
          }
          windings.rotation.x = Math.PI / 2;
          windings.position.y = 1.0;

          // Rotor (Solid Cylinder)
          const rotorGeom = new THREE.CylinderGeometry(0.75, 0.75, 2.3, 32);

          const rotor = new THREE.Mesh(rotorGeom, rotorMat);
          rotor.rotation.x = Math.PI / 2;

          const shaft = new THREE.Mesh(shaftGeom, shaftMat);
          shaft.rotation.x = Math.PI / 2;
          shaft.position.y = 1.0;

          // Flux Particles (Glowing Rings)
          const fluxGroup = new THREE.Group();
          for(let i=0; i<3; i++) {

              new THREE.TorusGeometry(0.85, 0.02, 8, 64),

          hitbox.position.y = 1.0;

          group.add(statorO, statorI, windings, rotor, shaft, fluxGroup, hitbox, internalLight);

          return { rotor, shaft, fluxGroup, hitbox };
        };

        // Induction Motor Model (Left)
        const motorGroup = new THREE.Group();
        motorGroup.position.set(-6, 0, 0);
        scene.add(motorGroup);
        const motorParts = createPremiumMachine(motorGroup, 0x1e3a8a, 0xb45309); // Blue frame, Copper coils

        scene.add(genGroup);
        const genParts = createPremiumMachine(genGroup, 0x78350f, 0xc2410c); // Bronze frame, Orange coils
        const genHitbox = genParts.hitbox;

        // Create canvas floating names with makes
        const createFloatingLabelCanvas = (title, subtitle) => {

          canvas.height = 128;
          const ctx = canvas.getContext("2d");
          
          ctx.fillStyle = "rgba(10, 20, 42, 0.85)";
          ctx.strokeStyle = "#eab308";
          ctx.lineWidth = 4;
          
          const x = 10, y = 10, w = 492, h = 108, r = 16;
          ctx.beginPath();
          ctx.moveTo(x + r, y);
          ctx.arcTo(x + w, y, x + w, y + h, r);
          ctx.arcTo(x + w, y + h, x, y + h, r);
          ctx.arcTo(x, y + h, x, y, r);
          ctx.arcTo(x, y, x + w, y, r);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          
          ctx.fillStyle = "#ffffff";
          ctx.font = "bold 26px 'Space Grotesk', sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(title, 256, 48);
          
          ctx.fillStyle = "#94a3b8";
          ctx.font = "italic 17px 'Outfit', sans-serif";
          ctx.fillText(subtitle, 256, 82);
          
          return canvas;
        };

        const motorLabelCanvas = createFloatingLabelCanvas("3φ INDUCTION MOTOR", "Kirloskar Electric // KE-IM2.2 // 3 HP");
        const motorTex = new THREE.CanvasTexture(motorLabelCanvas);
        const motorSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: motorTex, transparent: true }));
        motorSprite.scale.set(4.0, 1.0, 1.0);
        motorSprite.position.set(0, 2.5, 0);
        motorGroup.add(motorSprite);

        const genLabelCanvas = createFloatingLabelCanvas("SYNCHRONOUS ALTERNATOR", "Crompton Greaves // CG-SA3.5 // 3.5 kVA");
        const genTex = new THREE.CanvasTexture(genLabelCanvas);
        const genSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: genTex, transparent: true }));
        genSprite.scale.set(4.0, 1.0, 1.0);
        genSprite.position.set(0, 2.5, 0);
        genGroup.add(genSprite);

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        const onMouseMove = (event) => {
          const rect = renderer.domElement.getBoundingClientRect();
          mouse.x = ((event.clientX - rect.left) / width) * 2 - 1;
          mouse.y = -((event.clientY - rect.top) / height) * 2 + 1;
        };
        window.addEventListener('mousemove', onMouseMove);

        let animeId;
        const clock = new THREE.Clock();

        const animate = () => {
          animeId = requestAnimationFrame(animate);
          const time = clock.getElapsedTime();
          
          const mSpeed = motorSpeedRef.current || 20;
          const aSpeed = altSpeedRef.current || 20;
          
          motorParts.shaft.rotation.y = time * (mSpeed / 100);
          motorParts.rotor.rotation.y = time * (mSpeed / 100);
          genParts.shaft.rotation.y = time * (aSpeed / 100);
          genParts.rotor.rotation.y = time * (aSpeed / 100);

          // Animate Flux
          motorParts.fluxGroup.rotation.z = time * 3;
          genParts.fluxGroup.rotation.z = time * 3;

          const currentBay = selectedBayRef.current;
          if (currentBay === "motor") {
            motorGroup.rotation.y += 0.006;
          } else {
            motorGroup.rotation.y = THREE.MathUtils.lerp(motorGroup.rotation.y, 0, 0.05);
          }

          if (currentBay === "alternator") {
            genGroup.rotation.y += 0.006;
          } else {
            genGroup.rotation.y = THREE.MathUtils.lerp(genGroup.rotation.y, 0, 0.05);
          }
          
          raycaster.setFromCamera(mouse, camera);
          const intersects = raycaster.intersectObjects([motorHitbox, genHitbox]);

          if (intersects.length > 0) {
            const hit = intersects[0].object;
            if (hit === motorHitbox) {
              setHoveredLabel(isZoomedRef.current ? "⚡ DOUBLE CLICK TO ZOOM OUT" : "⚡ DOUBLE CLICK TO ZOOM MOTOR DECK");
              document.body.style.cursor = 'pointer';
            } else if (hit === genHitbox) {
              setHoveredLabel(isZoomedRef.current ? "⚡ DOUBLE CLICK TO ZOOM OUT" : "⚡ DOUBLE CLICK TO ZOOM ALTERNATOR");
              document.body.style.cursor = 'pointer';
            }
          } else {
            setHoveredLabel(null);
            document.body.style.cursor = 'default';
          }

          motorBase.scale.setScalar(1 + 0.08 * Math.sin(time * 4));
          genBase.scale.setScalar(1 + 0.06 * Math.sin(time * 3));

          controls.update();
          renderer.render(scene, camera);
        };
        animate();

        // Dual Click Zoom transition
        const isZoomedRef = { current: false };
        const onDblClick = () => {
          raycaster.setFromCamera(mouse, camera);
          const intersects = raycaster.intersectObjects([motorHitbox, genHitbox]);
          
          if (intersects.length > 0) {
            if (isZoomedRef.current) {
              // Zoom out
              isZoomedRef.current = false;
              setSelectedBay(null);
              gsap.to(camera.position, {
                x: 0, y: 8, z: 15, duration: 1.0, ease: 'power3.out', onUpdate: () => controls.update()
              });
              gsap.to(controls.target, {
                x: 0, y: 0, z: 0, duration: 1.0, ease: 'power3.out'
              });
            } else {
              // Zoom in
              isZoomedRef.current = true;
              const hit = intersects[0].object;
              let targetPos = new THREE.Vector3();
              let targetLookAt = new THREE.Vector3();
              let facilityId = "motor";
              
              if (hit === motorHitbox) {
                targetPos.set(-6, 2.0, 4.0);
                targetLookAt.set(-6, 1.0, 0);
                facilityId = "motor";
              } else if (hit === genHitbox) {
                targetPos.set(6, 2.0, 4.0);
                targetLookAt.set(6, 1.0, 0);
                facilityId = "alternator";
              }

              setSelectedBay(facilityId);

              gsap.to(camera.position, {
                x: targetPos.x,
                y: targetPos.y,
                z: targetPos.z,
                duration: 1.0,
                ease: 'power3.out',
                onUpdate: () => controls.update()
              });

              gsap.to(controls.target, {
                x: targetLookAt.x,
                y: targetLookAt.y,
                z: targetLookAt.z,
                duration: 1.0,
                ease: 'power3.out'
              });
            }
          }
        };
        window.addEventListener('dblclick', onDblClick);

        return () => {
          cancelAnimationFrame(animeId);
          window.removeEventListener('mousemove', onMouseMove);
          window.removeEventListener('dblclick', onDblClick);
          
          // Proper WebGL Dispose to fix blank screen glitch
          renderer.dispose();
          scene.traverse((object) => {
            if (object.isMesh) {
              if (object.geometry) object.geometry.dispose();
              if (object.material) {
                if (Array.isArray(object.material)) {
                  object.material.forEach(m => m.dispose());
                } else {
                  object.material.dispose();
                }
              }
            }
          });
          
          if (container && renderer.domElement) {
            container.removeChild(renderer.domElement);
          }
        };
      }, []); // Empty dependency array ensures it builds the scene only once on mount

      // Hyper-Zoom launch animation transition handler
      const launchLabWithAnimation = (facilityId) => {
        const overlay = document.getElementById("transition-overlay");
        if (overlay) {
          overlay.classList.remove("pointer-events-none");
          overlay.style.opacity = "1";
        }

        setTimeout(() => {
          setActiveFacility(facilityId);
          setView("dashboard");
        }, 800);
      };

      return (
        <div className="w-full h-full relative bg-slate-950">
          {/* Main Map Directory */}
          <div className="hologram-directory p-5 text-slate-200 w-72 pointer-events-auto">
            <h3 className="space-font font-bold text-sm tracking-wider text-yellow-500 uppercase border-b border-indigo-900 pb-2 mb-3">
              ⚡ Digital Twin Hub
            </h3>
            <ul className="space-y-3 text-xs font-bold">
              <li onClick={() => { setActiveFacility("motor"); setView("dashboard"); }} className="cursor-pointer text-yellow-500 hover:text-white flex items-center justify-between p-3 bg-slate-900/60 hover:bg-indigo-900 border border-slate-700 hover:border-yellow-500 rounded-lg transition-all shadow-sm hover:shadow-[0_0_15px_rgba(234,179,8,0.4)] backdrop-blur-sm">
                <span>🔄 Kirloskar Induction Motor</span>
                <i className="fa-solid fa-arrow-right text-[10px]"></i>
              </li>
              <li onClick={() => { setActiveFacility("alternator"); setView("dashboard"); }} className="cursor-pointer text-orange-400 hover:text-white flex items-center justify-between p-3 bg-slate-900/60 hover:bg-indigo-900 border border-slate-700 hover:border-orange-500 rounded-lg transition-all shadow-sm hover:shadow-[0_0_15px_rgba(249,115,22,0.4)] backdrop-blur-sm">
                <span>⚡ Crompton Sync Alternator</span>
                <i className="fa-solid fa-arrow-right text-[10px]"></i>
              </li>
            </ul>
          </div>

          <div ref={mountRef} className="w-full h-full"></div>

          {hoveredLabel && (
            <div className="absolute top-1/3 left-1/2 transform -translate-x-1/2 -translate-y-1/2 pointer-events-none bg-slate-950/90 border border-yellow-500 text-yellow-400 px-4 py-2.5 rounded-lg font-bold text-xs space-font tracking-widest uppercase glow-gold">
              {hoveredLabel}
            </div>
          )}

          {/* Specifications modal popup */}
          {showInfoModal && selectedBay && (
            <div className="absolute inset-0 bg-slate-950/80 backdrop-blur-sm z-40 flex items-center justify-center p-6 pointer-events-auto">
              <div className="w-full max-w-md glass-card p-6 border border-indigo-500 space-y-4">
                <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                  <h3 className="space-font font-bold text-sm text-yellow-500 uppercase tracking-widest">
                    ⚡ {selectedBay.toUpperCase()} TECHNICAL DATASHEET
                  </h3>
                  <button onClick={() => setShowInfoModal(false)} className="text-slate-400 hover:text-slate-200">
                    <i className="fa-solid fa-times"></i>
                  </button>
                </div>
                
                {selectedBay === "motor" ? (
                  <div className="text-xs text-slate-350 space-y-2">
                    <p><strong className="text-indigo-400">Class:</strong> 3-Phase Cage Induction Motor (Kirloskar KE-IM2.2)</p>
                    <p><strong className="text-indigo-400">Ratings:</strong> 2.2 kW (3 HP) // 415 V Delta // 4.6 A // 50 Hz</p>
                    <p><strong className="text-indigo-400">Mechanical Structure:</strong> Steel housing cowl cooling fins, squirrel cage rotor cage core, friction balance drum.</p>
                  </div>
                ) : (
                  <div className="text-xs text-slate-350 space-y-2">
                    <p><strong className="text-indigo-400">Class:</strong> Brushless Synchronous Generator (Crompton CG-SA3.5)</p>
                    <p><strong className="text-indigo-400">Ratings:</strong> 3.5 kVA // 415 V Star // 5.0 A // 1500 RPM</p>
                    <p><strong className="text-indigo-400">Excitation:</strong> 110 V DC rotor field slip rings and carbon brush contacts.</p>
                  </div>
                )}

                <div className="pt-2 flex justify-end">
                  <button 
                    onClick={() => setShowInfoModal(false)} 
                    className="px-4 py-2 bg-slate-900 border border-slate-700 hover:border-slate-500 rounded font-semibold text-xs text-slate-255 transition-all">
                    Close Specs
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Action Console Popup for highlighted machine */}
          {selectedBay && (
            <div className="absolute bottom-16 left-1/2 transform -translate-x-1/2 bg-slate-900/95 border-2 border-yellow-500 p-5 rounded-xl text-center shadow-2xl z-35 flex flex-col items-center space-y-3 min-w-[280px] pointer-events-auto">
              <h4 className="space-font font-bold text-sm text-yellow-400 uppercase tracking-widest">
                {selectedBay.toUpperCase()} BAY IDENTIFIED
              </h4>
              
              <div className="flex space-x-2 w-full">
                <button 
                  onClick={() => setShowInfoModal(true)} 
                  className="flex-1 px-3 py-2 bg-slate-950 border border-slate-700 hover:border-yellow-500 text-slate-300 rounded font-bold uppercase transition-all text-[10px]">
                  <i className="fa-solid fa-circle-info mr-1"></i> Specifications
                </button>
                <button 
                  onClick={() => launchLabWithAnimation(selectedBay)} 
                  className="flex-1 px-3 py-2 bg-yellow-500 hover:bg-yellow-600 text-slate-950 rounded font-black transition-all uppercase glow-gold text-[10px]">
                  Launch Lab Panel
                </button>
              </div>

              <button 
                onClick={() => setSelectedBay(null)} 
                className="text-[10px] text-slate-400 hover:text-slate-200 underline">
                Reset camera view
              </button>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);

  </script>
</body>
</html>
